<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-right">
      <span class="header-label">Roommates</span>
      <button class="icon-btn roommates-btn">👥</button>
      <span class="header-label">Profile</span>
      <button class="icon-btn profile-btn">🐶</button>
    </div>
  </div>

  <!-- ROOM BANNER -->
  <div class="banner-wrapper">
    <div class="room-banner"></div>
  </div>

  <!-- FORM CARD -->
  <div class="form-wrapper">
    <div class="form-card">

      <!-- TASK TITLE INPUT -->
      <input class="task-input" type="text" placeholder="Add a task..." [(ngModel)]="taskTitle" />

      <!-- OPTIONS SECTION -->
      <div class="options-card">

        <!-- PRIORITY -->
        <div class="option-row">
          <span class="option-label">Priority</span>
          <div class="option-btns">
            <button *ngFor="let p of priorityOptions" class="priority-btn"
              [style.background]="selectedPriority === p.id ? getPriorityColor(p.id) : '#e0e0e0'"
              [style.color]="selectedPriority === p.id ? 'white' : '#555'"
              (click)="selectPriority(p.id)">{{ p.name }}</button>
          </div>
        </div>

        <!-- EFFORT / DIFFICULTY -->
        <div class="option-row">
          <span class="option-label">Effort</span>
          <div class="option-btns">
            <button *ngFor="let d of difficultyOptions" class="duration-btn"
              [class.selected]="selectedDifficulty === d.id"
              (click)="selectDifficulty(d.id)">{{ d.name }}</button>
          </div>
        </div>

        <!-- ESTIMATED DURATION -->
        <div class="option-row">
          <span class="option-label">Estimated duration</span>
          <div class="option-btns">
            <button *ngFor="let d of durationOptions" class="duration-btn"
              [class.selected]="selectedDuration === d.id"
              (click)="selectDuration(d.id)">{{ d.minutes }} min</button>
          </div>
        </div>

        <!-- ASSIGN -->
        <div class="option-row assign-row">
          <span class="option-label assign-label">Assign</span>
          <div class="assign-input-wrapper">
            <input class="assign-input" placeholder="Type a name..." [(ngModel)]="searchName"
              (input)="filterHousemates()" />
            <span class="assign-icon">👤</span>
            <div class="dropdown" *ngIf="filteredHousemates.length > 0 && searchName">
              <div class="dropdown-item" *ngFor="let h of filteredHousemates" (click)="selectHousemate(h)">{{ h.name }}</div>
            </div>
          </div>
        </div>

      </div>

      <!-- ERROR MESSAGE -->
      <p class="error-msg" *ngIf="errorMsg">⚠️ {{ errorMsg }}</p>

      <!-- CREATE BUTTON -->
      <button class="create-btn" [disabled]="!isValid() || submitting" (click)="submit()">
        {{ submitting ? 'Creating...' : 'Create' }}
      </button>

    </div>
  </div>

  <!-- BACK BUTTON -->
  <button class="back-fab" (click)="goBack()">↩</button>

</div>
