<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="header-right">
      <span class="header-label">Home</span>
      <button class="icon-btn" (click)="goBack()">🏠</button>

      <span class="header-label">Housemates</span>
      <button class="icon-btn">👥</button>

      <span class="header-label">Home Info</span>
      <button class="icon-btn">🔑</button>
    </div>
  </header>

  <!-- ROOM BANNER -->
  <div class="banner-wrapper">
    <div class="room-banner"></div>
  </div>

  <!-- FORM CARD -->
  <div class="form-wrapper">
    <div class="form-card">

      <!-- TASK NAME -->
      <input
        class="task-input"
        placeholder="Add a task..."
        [(ngModel)]="task.title"
      />

      <!-- OPTIONS CARD -->
      <div class="options-card">

        <!-- PRIORITY -->
        <div class="option-row">
          <span class="option-label">Priority</span>
          <div class="option-btns">
            <button
              *ngFor="let p of [1, 2, 3]"
              class="priority-btn"
              [style.background]="task.priority === p ? getPriorityColor(p) : '#e0e0e0'"
              [style.color]="task.priority === p ? 'white' : '#555'"
              (click)="selectPriority(p)"
            >{{ getPriorityLabel(p) }}</button>
          </div>
        </div>

        <!-- ESTIMATED DURATION -->
        <div class="option-row">
          <span class="option-label">Estimated duration</span>
          <div class="option-btns">
            <button
              *ngFor="let d of [15, 30, 60]"
              class="duration-btn"
              [class.selected]="task.estimatedDurationMinutes === d"
              (click)="selectDuration(d)"
            >{{ d === 15 ? '15 min' : d === 30 ? '30 min' : '60 min' }}</button>
          </div>
        </div>

        <!-- EFFORT -->
        <div class="option-row">
          <span class="option-label">Effort</span>
          <div class="option-btns">
            <button
              *ngFor="let e of effortOptions"
              class="duration-btn"
              [class.selected]="task.difficulty === e.value"
              (click)="task.difficulty = e.value"
            >{{ e.label }}</button>
          </div>
        </div>

        <!-- ASSIGN -->
        <div class="option-row assign-row">
          <span class="option-label assign-label">Assign</span>
          <div class="assign-input-wrapper">
            <input
              class="assign-input"
              placeholder="Type a name..."
              [(ngModel)]="searchName"
              (input)="filterHousemates()"
            />
            <span class="assign-icon">👤</span>
            <div class="dropdown" *ngIf="filteredHousemates.length > 0 && searchName">
              <div
                class="dropdown-item"
                *ngFor="let h of filteredHousemates"
                (click)="selectHousemate(h)"
              >{{ h.name }}</div>
            </div>
          </div>
        </div>

      </div>

      <!-- CREATE BUTTON -->
      <button class="create-btn" [disabled]="!isValid()" (click)="submit()">
        Create
      </button>

    </div>
  </div>

  <!-- BACK BUTTON -->
  <button class="back-fab" (click)="goBack()">↩</button>

</div>
