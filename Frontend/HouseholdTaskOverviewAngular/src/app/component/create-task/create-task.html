<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-right">
      <span class="header-label">Home</span>
      <div class="icon-circle"><iconify-icon icon="hugeicons:home-07"></iconify-icon></div>
      
      <span class="header-label">Housemates</span>
      <div class="icon-circle"><iconify-icon icon="heroicons:user-group-16-solid"></iconify-icon></div>
      
      <span class="header-label">House Info</span>
      <div class="icon-circle"><iconify-icon icon="ion:key-outline"></iconify-icon></div>
    </div>
  </div>

  <!-- ROOM BANNER -->
  <div class="banner-wrapper">
    <div class="room-banner"></div>
  </div>

  <!-- FORM CARD (The Outer Light Blue Box #D6EDFF) -->
  <div class="form-wrapper">
    <div class="task-selection-menu">

      <!-- TASK TITLE INPUT -->
      <div class="task-title-wrapper">
        <input class="task-input" type="text" placeholder="Add a task..." [(ngModel)]="taskTitle" />
        <iconify-icon class="edit-icon" icon="fluent:edit-28-regular"></iconify-icon>
      </div>

      <!-- INNER SETTINGS CARD (The Darker Blue Box #99D1FF) -->
      <div class="nested-settings-card">
        
        <!-- PRIORITY -->
        <div class="option-row">
          <span class="option-label">Priority</span>
          <div class="option-btns">
            <button *ngFor="let p of priorityOptions" class="base-btn priority-btn"
              [ngClass]="{'selected': selectedPriority === p.id, 'p-low': p.id === 1, 'p-med': p.id === 2, 'p-high': p.id === 3}"
              (click)="selectPriority(p.id)">{{ p.name }}</button>
          </div>
        </div>

        <!-- EFFORT / DIFFICULTY -->
        <div class="option-row">
          <span class="option-label">Effort</span>
          <div class="option-btns">
            <button *ngFor="let d of difficultyOptions" class="base-btn effort-btn"
              [ngClass]="{'selected': selectedDifficulty === d.id, 'e-easy': d.id === 1, 'e-mod': d.id === 2, 'e-diff': d.id === 3}"
              (click)="selectDifficulty(d.id)">{{ d.name }}</button>
          </div>
        </div>

        <!-- ESTIMATED DURATION -->
        <div class="option-row">
          <span class="option-label">Estimated duration</span>
          <div class="option-btns">
            <button *ngFor="let d of durationOptions" class="base-btn duration-btn"
              [class.selected]="selectedDuration === d.id"
              (click)="selectDuration(d.id)">{{ d.minutes }} min</button>
          </div>
        </div>

        <!-- ASSIGN (AUTOCOMPLETE PILL) -->
        <div class="option-row assign-row">
          <span class="option-label">Assign</span>
          
          <div class="autocomplete-wrapper">
            <div class="input-pill">
              <input 
                type="text" 
                placeholder="Type a name..." 
                [(ngModel)]="searchName" 
                (input)="filterHousemates()" 
                (focus)="filterHousemates()"
                (blur)="closeDropdown()"
              />
              <iconify-icon class="search-icon" icon="fluent:person-search-32-filled"></iconify-icon>
            </div>
        
            <!-- Dropdown housemates Menu -->
            <div class="dropdown-menu" *ngIf="filteredHousemates.length > 0">
              <div 
                class="dropdown-item" 
                *ngFor="let person of filteredHousemates" 
                (mousedown)="selectHousemate(person)"> 
                
                <img [src]="'/assets/avatars/avatar' + person.avatarId + '.png'" class="tiny-avatar" *ngIf="person.avatarId" />
                {{ person.name }}
              </div>
            </div>
          </div>
        </div>

      </div> <!-- End of Inner Darker Blue Box -->

      <!-- CREATE BUTTON -->
      <div class="create-btn-wrapper">
        <p class="error-msg" *ngIf="errorMsg">⚠️ {{ errorMsg }}</p>
        <button class="create-btn" [disabled]="!isValid() || submitting" (click)="submit()">
          {{ submitting ? 'Creating...' : 'Create' }}
        </button>
      </div>

    </div>
  </div>

  <!-- FLOATING BACK BUTTON -->
  <button class="back-fab" (click)="goBack()">
    <iconify-icon icon="streamline-freehand:keyboard-arrow-return"></iconify-icon>
  </button>

</div>
