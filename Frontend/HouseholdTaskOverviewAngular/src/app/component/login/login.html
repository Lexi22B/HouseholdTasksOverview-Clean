<div class="page">
  <img
    class="illustration"
    src="assets/cleaning_picture.png"
    alt="Login illustration"
  />

  <h1 class="title">Hello!</h1>
  <p class="subtitle">Login to get started</p>

  <form class="form-card" (ngSubmit)="onJoinHouse()">

    <!-- HOUSE ID -->
    <div class="form-group">
      <label for="houseCode">House ID</label>
      <input
        id="houseCode"
        type="text"
        placeholder="Provide a house name ID"
        [(ngModel)]="houseCode"
        name="houseCode"
      />

      <p class="error" *ngIf="showErrors && !houseCode">
        User name not found. Try again.
      </p>
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Provide your house password"
        [(ngModel)]="password"
        name="password"
      />

      <p class="error" *ngIf="showErrors && !password">
        Password incorrect. Try again.
      </p>
    </div>

    <!-- BACKEND LOGIN ERROR -->
    <p class="error" *ngIf="loginError">
      {{ loginError }}
    </p>

    <p class="forgot-link">Forgot your password?</p>

    <button type="submit" class="join-btn">Join House</button>
  </form>
</div>
